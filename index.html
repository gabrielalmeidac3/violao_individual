<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Vagas para a Comunidade de Violão.">
    <title>Aviso - Comunidade de Violão</title>
    <link rel="icon" type="image/webp" href="images/0_img.webp">

    <!-- Fonts Premium -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,600;1,700&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background: linear-gradient(135deg, #070b1a 0%, #111424 50%, #0d122b 100%);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            text-align: center;
        }

        .container {
            max-width: 450px;
            width: 100%;
            background: rgba(15, 18, 45, 0.8);
            backdrop-filter: blur(10px);
            padding: 40px 30px;
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
        }

        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 26px;
            line-height: 1.3;
            margin-bottom: 25px;
            color: #ffffff;
            background: linear-gradient(45deg, #ffb74d, #ffa726);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header-image {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid rgba(255, 183, 77, 0.3);
            margin-bottom: 20px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }

        .image-wrapper {
            position: relative;
            margin-bottom: 30px;
            display: inline-block;
        }

        .main-image {
            width: 100%;
            max-width: 220px;
            border-radius: 15px;
        }

        .check-list {
            list-style: none;
            text-align: left;
            margin: 25px 0 35px 0;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .check-item {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 17px;
            color: #e3f2fd;
        }

        .check-icon {
            width: 22px;
            height: 22px;
            background: rgba(76, 175, 80, 0.2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .check-icon svg {
            width: 14px;
            height: 14px;
            fill: #81c784;
        }

        .btn {
            display: block;
            width: 100%;
            padding: 18px 30px;
            border-radius: 15px;
            font-size: 18px;
            font-weight: 700;
            text-decoration: none;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            border: none;
        }

        .btn-green {
            background: linear-gradient(135deg, #0ba343 0%, #2cae62 100%);
            color: white;
            box-shadow: 0 8px 25px rgba(11, 163, 96, 0.3);
        }

        .btn-green:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 30px rgba(11, 163, 96, 0.5);
            filter: brightness(1.1);
        }

        @media (max-width: 480px) {
            .container {
                padding: 30px 20px;
            }
            h1 {
                font-size: 22px;
            }
            .check-item {
                font-size: 16px;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <img src="images/img.webp" alt="Gabriel Almeida" class="header-image">
        <h1>Vagas disponiveis no momento apenas para a Comunidade:</h1>

        <div class="image-wrapper">
            <img src="images/VIODEP40.webp" alt="Comunidade de Violão" class="main-image">
        </div>

        <ul class="check-list">
            <li class="check-item">
                <div class="check-icon">
                    <svg viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41L9 16.17z"/></svg>
                </div>
                Videochamadas semanais
            </li>
            <li class="check-item">
                <div class="check-icon">
                    <svg viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41L9 16.17z"/></svg>
                </div>
                Grupo para análise de vídeo e áudio
            </li>
            <li class="check-item">
                <div class="check-icon">
                    <svg viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41L9 16.17z"/></svg>
                </div>
                Curso gravado completo
            </li>
            <li class="check-item">
                <div class="check-icon">
                    <svg viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41L9 16.17z"/></svg>
                </div>
                Cifras
            </li>
        </ul>

        <a href="https://gabrielalmeidac3.github.io/enc/15d" class="btn btn-green">Participar da Comunidade</a>
    </div>
</body>

</html>
